name: bmc-provisioner

# 部署在可达 BMC 管理网的 Linux 主机上：lessord 必须使用 host 网络接收 DHCP 广播。
# 默认监听所有宿主机地址，便于从管理网远程访问；生产环境务必在主机防火墙限制 8080/6770 的来源。
services:
  lessord:
    image: ${LESSOR_IMAGE:-willdockerhub/lessord:0.0.8}
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - lessord-data:/var/lib/lessord
    command:
      - --config=/var/lib/lessord/lessor.json
      - --lease-db=/var/lib/lessord/leases.db
      - --http=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/lessord", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bmc-provisioner:
    image: ${BMC_PROVISIONER_IMAGE:-ghcr.io/weironz/bmc-provisioner:v0.1.2}
    network_mode: host
    restart: unless-stopped
    depends_on:
      lessord:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - bmc-provisioner-data:/var/lib/bmc-provisioner
    environment:
      BMC_PROVISIONER_BIND: 0.0.0.0:6770
      LOCALAPPDATA: /var/lib/bmc-provisioner
      # Docker 默认没有系统密钥链；密码仅保留在服务内存至容器重启。
      BMC_PROVISIONER_SESSION_CREDENTIALS: "1"

volumes:
  lessord-data:
  bmc-provisioner-data:
