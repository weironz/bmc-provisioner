[package]
name = "bmc-provisioner"
version = "0.1.0"
edition = "2024"
description = "Provision a single DHCP-addressed BMC through lessor and Redfish"
license = "Apache-2.0"

[lib]
name = "bmc_provisioner"
path = "src/lib.rs"

[[bin]]
name = "bmc-provisionerd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
wiremock = "0.6"
