name: release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验标签与应用版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          tauri_ver=$(grep -m1 '"version"' ui/src-tauri/tauri.conf.json | sed 's/.*: "\(.*\)".*/\1/')
          ui_ver=$(grep -m1 '"version"' ui/package.json | sed 's/.*: "\(.*\)".*/\1/')
          test "$tag" = "$cargo_ver"
          test "$tag" = "$tauri_ver"
          test "$tag" = "$ui_ver"
      - name: 校验更新公钥已配置
        run: |
          pubkey=$(grep -m1 '"pubkey"' ui/src-tauri/tauri.conf.json | sed 's/.*: "\(.*\)".*/\1/')
          test -n "$pubkey" || { echo "::error::缺少 updater.pubkey"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 前端检查与 Rust 测试
        run: |
          cd ui && bun install --frozen-lockfile && bun run check && bun run build
          cd .. && cargo test

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建服务端与 Compose 包
        shell: bash
        run: |
          cd ui && bun install --frozen-lockfile && bun run build
          cd .. && cargo build --release --locked --bin bmc-provisionerd
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out/cli/ui out/compose
          cp target/release/bmc-provisionerd out/cli/
          cp -a ui/dist out/cli/ui/dist
          tar -czf "out/bmc-provisioner-$v-x86_64-linux.tar.gz" -C out/cli bmc-provisionerd ui
          cp compose.yaml .env.example README.md out/compose/
          tar -czf "out/bmc-provisioner-compose-$v.tar.gz" -C out/compose compose.yaml .env.example README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: out/*.tar.gz

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui/src-tauri
      - name: 构建已签名的桌面端 sidecar 与安装包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          cargo build --release --locked --bin bmc-provisionerd
          mkdir -p ui/src-tauri/binaries
          cp target/release/bmc-provisionerd.exe ui/src-tauri/binaries/bmc-provisionerd-x86_64-pc-windows-msvc.exe
          cd ui
          bun install --frozen-lockfile
          bunx tauri build --bundles nsis
      - name: 收集 Windows 产物
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          # productName 带空格，NSIS 产出的文件名也带空格；GitHub Release 上传时会把空格
          # 改写成点，而 latest.json 按原名拼 URL，自动更新就会 404。这里先改成无空格的名字。
          $setup = Get-ChildItem ui/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $name = "bmc-provisioner-$version-x64-setup.exe"
          Copy-Item $setup.FullName "out/$name"
          Copy-Item "$($setup.FullName).sig" "out/$name.sig"
          Compress-Archive -Path target/release/bmc-provisionerd.exe -DestinationPath "out/bmc-provisioner-$version-x86_64-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: out/*

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  github-release:
    needs: [linux, windows, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-assets"
          merge-multiple: true
      - name: 校验发布产物
        run: |
          test -n "$(find dist -name '*x86_64-linux.tar.gz' -print -quit)"
          test -n "$(find dist -name '*setup.exe' -print -quit)"
          test -n "$(find dist -name '*setup.exe.sig' -print -quit)"
          test -n "$(find dist -name '*x86_64-windows.zip' -print -quit)"
          test -n "$(find dist -name '*compose-*.tar.gz' -print -quit)"
      - name: 生成桌面自动更新清单
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          setup=$(find dist -name '*-setup.exe' -print -quit)
          asset=$(basename "$setup")
          # GitHub 上传资产时会改写名字里的空格等字符，改写后这里拼出的 URL 就 404。
          case "$asset" in *[!A-Za-z0-9._-]*) echo "::error::安装包名 $asset 含 GitHub 会改写的字符"; exit 1 ;; esac
          signature=$(cat "${setup}.sig")
          cat > dist/latest.json <<JSON
          {
            "version": "$version",
            "notes": "bmc-provisioner ${GITHUB_REF_NAME}，变更见 GitHub Release。",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$signature",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset}"
              }
            }
          }
          JSON
          python3 -c "import json; data=json.load(open('dist/latest.json')); assert data['platforms']['windows-x86_64']['signature']; print('latest.json ok')"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## BMC Provisioner ${{ github.ref_name }}

            - Windows：下载 `*-setup.exe` 安装桌面端；
              桌面端左上角版本号可检查、下载并验证签名后安装后续更新；
            - Linux：下载 `*-x86_64-linux.tar.gz`，解压后从解压目录运行 `./bmc-provisionerd`；
            - IDC 双服务部署：下载 `*-compose-*.tar.gz`，解压后按 README 启动。

            Docker 镜像：`ghcr.io/${{ github.repository }}:${{ github.ref_name }}`。
            Compose 同时运行 lessord 与 bmc-provisioner；lessord 使用 host 网络接收 DHCP 广播。
      - name: 校验自动更新链接可下载
        shell: bash
        run: |
          url=$(python3 -c "import json; print(json.load(open('dist/latest.json'))['platforms']['windows-x86_64']['url'])")
          for _ in 1 2 3 4 5; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            test "$code" = 200 && { echo "更新链接可下载：$url"; exit 0; }
            sleep 5
          done
          echo "::error::更新链接不可下载（HTTP $code）：$url"
          exit 1
